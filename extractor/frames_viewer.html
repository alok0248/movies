<!DOCTYPE html>
<html>
<head>
<title>Video Frames</title>
<style>
body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
h2 { color: #e50914; margin: 20px 0 10px; }
.frame-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.frame-row img { max-width: 300px; border-radius: 8px; border: 2px solid #333; }
.frame-label { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h2>Website Sample Frames</h2>
<div class="frame-row">
<div><img src="webframe_0.jpg"><div class="frame-label">Frame 0 (10%)</div></div>
<div><img src="webframe_1.jpg"><div class="frame-label">Frame 1 (30%)</div></div>
<div><img src="webframe_2.jpg"><div class="frame-label">Frame 2 (50%)</div></div>
<div><img src="webframe_3.jpg"><div class="frame-label">Frame 3 (70%)</div></div>
<div><img src="webframe_4.jpg"><div class="frame-label">Frame 4 (90%)</div></div>
</div>
<h2>Player Sample Frames</h2>
<div class="frame-row">
<div><img src="playerframe_0.jpg"><div class="frame-label">Frame 0 (10%)</div></div>
<div><img src="playerframe_1.jpg"><div class="frame-label">Frame 1 (30%)</div></div>
<div><img src="playerframe_2.jpg"><div class="frame-label">Frame 2 (50%)</div></div>
<div><img src="playerframe_3.jpg"><div class="frame-label">Frame 3 (70%)</div></div>
<div><img src="playerframe_4.jpg"><div class="frame-label">Frame 4 (90%)</div></div>
</div>
</body>
</html>
