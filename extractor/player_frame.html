<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Frame</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .audio-vis{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#81c784;font-size:.6rem;padding:2px 6px;border-radius:3px;display:none;z-index:3;pointer-events:none}
  .audio-vis.on{display:block}
</style>
</head>
<body>
<video id="vid" controls playsinline></video>
<div class="audio-vis" id="audioVis">AUDIO SYNC</div>
<!-- Hidden audio-only video element -->
<video id="audioVid" style="position:absolute;width:0;height:0;visibility:hidden" playsinline></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
(function(){
  var video=document.getElementById("vid");
  var audioVid=document.getElementById("audioVid");
  var audioVis=document.getElementById("audioVis");
  var hls=null, hlsAudio=null;
  var dualMode=false;
  var audioOffset=0;
  var syncInterval=null;
  var muteEnforceInterval=null;
  var userVideoVol=0, userAudioVol=1;
  var savedTime=0; // preserve playback position across switches

  function log(tag,msg){
    try{parent.postMessage({type:"frameLog",tag:tag,msg:msg},"*")}catch(e){}
  }

  // ====== Aggressive mute enforcement for video in dual mode ======
  function startMuteEnforce(){
    if(muteEnforceInterval)return;
    muteEnforceInterval=setInterval(function(){
      if(dualMode){
        video.muted=true;
        video.volume=0;
      }
    },50);
  }
  function stopMuteEnforce(){
    if(muteEnforceInterval){clearInterval(muteEnforceInterval);muteEnforceInterval=null}
  }
  // Also use MutationObserver as backup
  var muteObserver=new MutationObserver(function(){
    if(dualMode&&(!video.muted||video.volume>0)){
      video.muted=true;video.volume=0;
    }
  });
  muteObserver.observe(video,{attributes:true,attributeFilter:["muted","volume"]});

  // ====== Sync loop ======
  function startSync(){
    if(syncInterval)return;
    audioVis.classList.add("on");
    syncInterval=setInterval(function(){
      if(!dualMode)return;
      try{
        var vTime=video.currentTime;
        var aTime=audioVid.currentTime;
        var drift=vTime-audioOffset-aTime;
        if(Math.abs(drift)>0.15){
          audioVid.currentTime=vTime-audioOffset;
        }
      }catch(e){}
    },200);
  }
  function stopSync(){
    if(syncInterval){clearInterval(syncInterval);syncInterval=null}
    audioVis.classList.remove("on");
  }

  // ====== Sync handlers ======
  video.addEventListener("play",function(){
    if(dualMode&&audioVid.src){
      audioVid.currentTime=video.currentTime-audioOffset;
      audioVid.play().catch(function(){});
      startSync();
    }
  });
  video.addEventListener("pause",function(){
    if(dualMode)audioVid.pause();
  });
  video.addEventListener("seeking",function(){
    if(dualMode&&audioVid.src){
      audioVid.currentTime=video.currentTime-audioOffset;
    }
  });
  video.addEventListener("ended",function(){
    if(dualMode)audioVid.pause();
    stopSync();
  });

  // ====== Message handler ======
  window.addEventListener("message",function(ev){
    if(!ev.data)return;
    var d=ev.data;
    if(d.type==="play"&&d.url){
      dualMode=false;stopSync();stopMuteEnforce();
      // Restore video audio for single mode
      video.muted=false;video.volume=1;
      savedTime=video.currentTime||0;
      playUrl(d.url);
    }
    if(d.type==="playDual"&&d.videoUrl){
      dualMode=true;
      stopSync();
      savedTime=video.currentTime||0;
      audioOffset=d.offset||0;
      startMuteEnforce();
      playDual(d.videoUrl,d.audioUrl);
    }
    if(d.type==="setOffset"){
      audioOffset=d.offset||0;
      if(dualMode&&audioVid.src){
        audioVid.currentTime=video.currentTime-audioOffset;
      }
    }
    if(d.type==="setVolume"){
      var target=d.target;
      var vol=d.volume;
      if(target==="video"){
        userVideoVol=vol;
        if(!dualMode){video.volume=vol;video.muted=(vol===0)}
      }else if(target==="audio"){
        userAudioVol=vol;
        audioVid.volume=vol;
        audioVid.muted=(vol===0);
      }
    }
    if(d.type==="stop"){
      if(hls){hls.destroy();hls=null}
      if(hlsAudio){hlsAudio.destroy();hlsAudio=null}
      video.pause();video.removeAttribute("src");video.load();
      audioVid.pause();audioVid.removeAttribute("src");audioVid.load();
      dualMode=false;stopSync();stopMuteEnforce();
      video.muted=false;video.volume=1;
    }
  });

  // ====== Single play ======
  function playUrl(url){
    if(hls){hls.destroy();hls=null}
    video.removeAttribute("src");video.load();
    if(url.indexOf(".m3u8")>-1){
      loadHLS(video,function(){return new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:30})},url,function(h){hls=h},null);
    }else{
      var px=makeProxy(url);
      video.src=px;
      video.play().catch(function(){});
    }
  }

  // ====== Dual play ======
  function playDual(videoUrl,audioUrl){
    log("STEP","=== Dual play ===");
    if(hls){hls.destroy();hls=null}
    if(hlsAudio){hlsAudio.destroy();hlsAudio=null}
    // Save current position
    savedTime=video.currentTime||0;
    video.removeAttribute("src");video.load();
    audioVid.removeAttribute("src");audioVid.load();
    // Force mute video
    video.muted=true;video.volume=0;
    // Audio starts muted for autoplay, unmuted after play
    audioVid.muted=true;audioVid.volume=0;

    var videoReady=false,audioReady=false;
    function checkBoth(){
      if(!videoReady||!audioReady)return;
      log("OK","Both streams ready — starting playback");
      // Restore position
      video.currentTime=savedTime;
      audioVid.currentTime=savedTime-audioOffset;
      // Play muted video first (autoplay works)
      video.play().then(function(){
        log("OK","Video playing");
        // Unmute audio AFTER autoplay gesture established
        audioVid.volume=userAudioVol;
        audioVid.muted=(userAudioVol===0);
        return audioVid.play();
      }).then(function(){
        log("OK","Audio playing, vol="+userAudioVol);
        startSync();
      }).catch(function(e){
        log("ERR","Play error: "+e.message);
        // Fallback: force unmute audio
        audioVid.volume=userAudioVol;
        audioVid.muted=false;
        audioVid.play().catch(function(e2){});
      });
    }

    // Load video (muted via isMuted=true → LEVEL_SWITCHING enforces)
    loadHLS(video,function(){return new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:30})},videoUrl,function(h){hls=h},function(){
      videoReady=true;log("OK","Video stream loaded");checkBoth();
    },true);

    // Load audio (isMuted=false — we control mute manually)
    loadHLS(audioVid,function(){return new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:30})},audioUrl,function(h){hlsAudio=h},function(){
      audioReady=true;log("OK","Audio stream loaded");checkBoth();
    },false);
  }

  // ====== Generic HLS loader ======
  function loadHLS(el,createHls,url,hlsSetter,onReady,enforceMute){
    var px=makeProxy(url);
    fetch(px).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.text();
    }).then(function(text){
      var rewritten=rewriteManifest(text,url);
      var blob=new Blob([rewritten],{type:"application/vnd.apple.mpegurl"});
      var blobUrl=URL.createObjectURL(blob);
      var h=createHls();
      hlsSetter(h);
      h.on(Hls.Events.MANIFEST_PARSED,function(e,d){
        log("OK","Parsed "+d.levels.length+" levels");
        if(onReady)onReady();
      });
      h.on(Hls.Events.ERROR,function(e,d){
        log("ERR","HLS: "+d.type+"/"+d.details);
        if(d.fatal){
          if(d.type===Hls.ErrorTypes.NETWORK_ERROR)setTimeout(function(){if(h)h.startLoad()},2000);
          else if(d.type===Hls.ErrorTypes.MEDIA_ERROR)h.recoverMediaError();
        }
      });
      if(enforceMute){
        h.on(Hls.Events.LEVEL_SWITCHING,function(){el.muted=true;el.volume=0});
      }
      h.loadSource(blobUrl);
      h.attachMedia(el);
      if(enforceMute){el.muted=true;el.volume=0}
    }).catch(function(e){
      log("ERR","Load failed: "+e.message);
    });
  }

  // ====== Helpers ======
  function makeProxy(url){
    if(!url)return url;
    try{var u=new URL(url);return location.origin+"/proxy/"+u.host+u.pathname+u.search}catch(e){return url}
  }
  function rewriteManifest(text,origUrl){
    var lines=text.split("\n");
    var base=origUrl.substring(0,origUrl.lastIndexOf("/")+1);
    var out=[];
    for(var i=0;i<lines.length;i++){
      var line=lines[i].trim();
      if(line===""){out.push("");continue}
      if(line.charAt(0)==="#"){
        out.push(line.replace(/URI="([^"]+)"/gi,function(m,u){
          var full=u.indexOf("http")===0?u:base+u;
          return 'URI="'+makeProxy(full)+'"';
        }));
      }else{
        var full=line.indexOf("http")===0?line:base+line;
        out.push(makeProxy(full));
      }
    }
    return out.join("\n");
  }

  try{parent.postMessage({type:"frameReady"},"*")}catch(e){}
})();
</script>
</body>
</html>
