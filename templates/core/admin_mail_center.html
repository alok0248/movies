{% extends 'core/admin_base.html' %}
{% block title %}Mail - Admin{% endblock %}
{% block admin_content %}
<style>
    /* One mailbox: rail, list, reading pane. The three feeds that used to be
       three pages (received mail/chat, sent mail, in-app notifications) are
       folders here, so the same list/read model applies to all of them. */
    .ml { --ml-line: var(--adm-line); --ml-hover: var(--surface-hover);
          max-width: 1560px; display: flex; flex-direction: column; gap: .75rem; }
    .ml-top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .ml-compose {
        display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.1rem;
        border-radius: 999px; font-weight: 700; font-size: .82rem; text-decoration: none;
        color: #08131f; background: color-mix(in srgb, var(--brand) 88%, #fff);
        box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent);
        white-space: nowrap;
    }
    .ml-compose:hover { filter: brightness(1.08); color: #08131f; }
    .ml-search { flex: 1; min-width: 12rem; position: relative; }
    .ml-search i { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
        font-size: .8rem; color: var(--text-2); pointer-events: none; }
    .ml-search input { width: 100%; padding: .55rem .9rem .55rem 2.2rem; border-radius: 999px;
        border: 1px solid var(--ml-line); background: var(--card-bg, var(--surface));
        color: var(--text); font-size: .82rem; }
    .ml-search input:focus { outline: 2px solid color-mix(in srgb, var(--brand) 45%, transparent);
        outline-offset: 1px; }
    .ml-top-right { display: flex; gap: .35rem; align-items: center; font-size: .72rem; color: var(--text-2); }
    .ml-chip { padding: .1rem .5rem; border-radius: 999px; border: 1px solid var(--ml-line); white-space: nowrap; }

    .ml-body { display: grid; grid-template-columns: 208px minmax(0, 1fr) minmax(0, 1.15fr);
        gap: .7rem; align-items: start; }
    .ml-body.is-wide { grid-template-columns: 208px minmax(0, 1fr); }
    body.admin-page .ml { color: var(--text); }

    /* ---- rail ---- */
    .ml-rail { display: flex; flex-direction: column; gap: .18rem; padding: .35rem .15rem; }
    .ml-folder { display: flex; align-items: center; gap: .55rem; padding: .45rem .7rem;
        border-radius: 999px; text-decoration: none; color: var(--text); font-size: .8rem; font-weight: 600; }
    .ml-folder i { width: 1rem; text-align: center; opacity: .8; font-size: .78rem; }
    .ml-folder:hover { background: var(--ml-hover); color: var(--text); }
    .ml-folder.is-active { background: color-mix(in srgb, var(--brand) 20%, transparent); color: var(--text); }
    .ml-folder .n { margin-left: auto; font-size: .68rem; font-weight: 700; color: var(--text-2);
        background: var(--ml-hover); border-radius: 999px; padding: .02rem .4rem; }
    .ml-folder.is-active .n { color: var(--text); }
    .ml-rail-sep { height: 1px; background: var(--ml-line); margin: .45rem .6rem; }
    .ml-rail-title { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em;
        color: var(--text-2); padding: .3rem .85rem; }
    .ml-rail-note { font-size: .68rem; color: var(--text-2); padding: .2rem .85rem; line-height: 1.45; }

    /* ---- list ---- */
    .ml-list, .ml-pane { border: 1px solid var(--ml-line); border-radius: 14px;
        background: var(--card-bg, var(--surface)); overflow: hidden; }
    .ml-list-head { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
        padding: .55rem .75rem; border-bottom: 1px solid var(--ml-line); }
    .ml-list-title { font-size: .84rem; font-weight: 700; margin: 0; }
    .ml-list-count { font-size: .68rem; color: var(--text-2); }
    .ml-filter { display: flex; gap: .3rem; margin-left: auto; flex-wrap: wrap; }
    .ml-filter select { font-size: .7rem; padding: .2rem .4rem; border-radius: 8px;
        border: 1px solid var(--ml-line); background: transparent; color: var(--text); }
    .ml-rows { max-height: 74vh; overflow: auto; }
    .ml-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto;
        gap: .55rem; padding: .5rem .75rem; text-decoration: none; color: var(--text);
        border-bottom: 1px solid color-mix(in srgb, var(--ml-line) 55%, transparent);
        border-left: 3px solid transparent; align-items: center; }
    .ml-row:hover { background: var(--ml-hover); color: var(--text); }
    .ml-row.is-active { background: color-mix(in srgb, var(--brand) 12%, transparent);
        border-left-color: color-mix(in srgb, var(--brand) 75%, transparent); }
    .ml-av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
        font-size: .68rem; font-weight: 800; letter-spacing: .01em;
        background: color-mix(in srgb, var(--brand) 26%, transparent); color: var(--text); }
    .ml-av.is-bell { background: rgba(96,165,250,.18); }
    .ml-av.is-mail { background: rgba(56,189,248,.16); }
    .ml-row-main { min-width: 0; display: block; }
    .ml-row-who { display: flex; align-items: baseline; gap: .35rem; font-size: .78rem; min-width: 0; }
    .ml-row-who b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ml-row-sub { display: block; font-size: .74rem; color: var(--text-2); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
    .ml-row.is-unread .ml-row-who b, .ml-row.is-unread .ml-row-sub { color: var(--text); font-weight: 700; }
    .ml-row-right { text-align: right; font-size: .66rem; color: var(--text-2); white-space: nowrap; }
    .ml-row-right .dots { display: flex; gap: .2rem; justify-content: flex-end; margin-top: .15rem; }
    .ml-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .ml-dot.is-pending { background: #94a3b8; }
    .ml-dot.is-sent { background: #38bdf8; }
    .ml-dot.is-read { background: #22c55e; }
    .ml-dot.is-failed { background: #ef4444; }
    .ml-dot.is-wait { background: #f59e0b; }
    .ml-empty { padding: 2.2rem 1rem; text-align: center; color: var(--text-2); font-size: .8rem; }

    /* ---- reading pane ---- */
    .ml-pane-head { display: flex; align-items: flex-start; gap: .6rem; padding: .8rem .9rem;
        border-bottom: 1px solid var(--ml-line); }
    .ml-pane-subject { font-size: .98rem; font-weight: 700; margin: 0 0 .2rem; line-height: 1.3; }
    .ml-pane-meta { font-size: .7rem; color: var(--text-2); }
    .ml-pane-actions { margin-left: auto; display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
    .ml-pane-body { padding: .9rem; max-height: 62vh; overflow: auto; }
    .ml-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .84rem; line-height: 1.6; }
    .ml-quote { border-left: 2px solid color-mix(in srgb, var(--brand) 55%, transparent);
        padding-left: .6rem; margin: .6rem 0 0; font-size: .78rem; color: var(--text-2); }
    .ml-stats { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0 .8rem; }
    .ml-pill { display: inline-flex; gap: .3rem; align-items: center; padding: .1rem .5rem;
        border-radius: 999px; font-size: .68rem; font-weight: 700; border: 1px solid transparent; }
    .ml-pill.is-pending { background: rgba(148,163,184,.16); border-color: rgba(148,163,184,.4); color: #94a3b8; }
    .ml-pill.is-sent { background: rgba(56,189,248,.14); border-color: rgba(56,189,248,.35); color: #38bdf8; }
    .ml-pill.is-delivered { background: rgba(96,165,250,.16); border-color: rgba(96,165,250,.4); color: #60a5fa; }
    .ml-pill.is-read { background: rgba(34,197,94,.14); border-color: rgba(34,197,94,.35); color: #22c55e; }
    .ml-pill.is-failed { background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.35); color: #ef4444; }
    .ml-mini { width: 100%; border-collapse: collapse; font-size: .74rem; }
    .ml-mini th { text-align: left; font-size: .66rem; text-transform: uppercase;
        letter-spacing: .05em; color: var(--text-2); padding: .3rem .35rem;
        border-bottom: 1px solid var(--ml-line); font-weight: 700; }
    .ml-mini td { padding: .3rem .35rem; border-bottom: 1px solid color-mix(in srgb, var(--ml-line) 45%, transparent);
        vertical-align: top; }
    .ml-mini .err { color: #ef4444; font-size: .68rem; overflow-wrap: anywhere; }
    .ml-reply { border-top: 1px solid var(--ml-line); padding: .75rem .9rem; }
    .ml-reply textarea { width: 100%; min-height: 5.5rem; border-radius: 10px;
        border: 1px solid var(--ml-line); background: transparent; color: var(--text);
        padding: .55rem .65rem; font-size: .82rem; }
    .ml-reply-foot { display: flex; align-items: center; gap: .4rem; margin-top: .4rem; flex-wrap: wrap; }
    .ml-chip-btn { font-size: .68rem; padding: .15rem .5rem; border-radius: 999px;
        border: 1px solid var(--ml-line); background: transparent; color: var(--text-2); cursor: pointer; }
    .ml-chip-btn:hover { color: var(--text); background: var(--ml-hover); }
    .ml-note { font-size: .7rem; color: var(--text-2); }

    /* ---- compose / devices ---- */
    .ml-wide-body { padding: .9rem; }
    .ml-form-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, .9fr); gap: .9rem; }
    .ml-field { margin-bottom: .6rem; }
    .ml-field label { display: block; font-size: .72rem; font-weight: 700; margin-bottom: .2rem; color: var(--text-2); }
    .ml-field input, .ml-field select, .ml-field textarea { width: 100%; border-radius: 9px;
        border: 1px solid var(--ml-line); background: transparent; color: var(--text);
        padding: .45rem .6rem; font-size: .8rem; }
    .ml-field textarea { min-height: 8rem; }
    .ml-check { display: flex; align-items: center; gap: .4rem; font-size: .76rem; }
    .ml-send { display: inline-flex; align-items: center; gap: .45rem; padding: .5rem 1rem;
        border-radius: 999px; border: 0; font-weight: 700; font-size: .8rem; cursor: pointer;
        background: color-mix(in srgb, var(--brand) 88%, #fff); color: #08131f; }
    .ml-facts { display: grid; gap: .5rem; font-size: .74rem; }
    .ml-facts b { display: block; font-size: .72rem; }
    .ml-table-wrap { overflow: auto; }
    .ml-dev-check { width: .95rem; height: .95rem; accent-color: var(--brand); }
    .ml-toolbar { display: flex; gap: .4rem; flex-wrap: wrap; align-items: end; margin-bottom: .7rem; }

    /* In-place updates: the mailbox reloads only itself, never the shell. */
    .ml.is-busy { opacity: .55; pointer-events: none; }
    .ml-flash { display: flex; flex-direction: column; gap: .4rem; }

    @media (max-width: 1180px) {
        .ml-body, .ml-body.is-wide { grid-template-columns: minmax(0, 1fr); }
        .ml-rail { flex-direction: row; flex-wrap: wrap; overflow-x: auto; }
        .ml-rail-sep, .ml-rail-title, .ml-rail-note { display: none; }
        .ml-rows { max-height: none; }
        .ml-pane-body { max-height: none; }
        .ml-form-grid { grid-template-columns: minmax(0, 1fr); }
    }
</style>
{% include 'core/_mail_center_panel.html' %}

<script>
/* One page, one mailbox: folder switches, list rows, filters, replies, retries
   and sends all fetch the same fragment the server would have rendered and swap
   it into #mlRoot. The admin shell, the scroll position and any other panel on
   the page stay exactly as they were; the address bar follows along so a
   refresh or a shared link still lands on the same view. */
(function () {
    var MAIL_URL = "{% url 'mail_center' %}";
    var root = document.getElementById('mlRoot');
    var busy = false;

    function isMailbox(url) {
        try {
            var u = new URL(url, window.location.href);
            return u.origin === window.location.origin && u.pathname === MAIL_URL;
        } catch (e) { return false; }
    }

    function setBusy(on) {
        busy = on;
        if (root) { root.classList.toggle('is-busy', on); }
        document.body.style.cursor = on ? 'progress' : '';
    }

    function swap(html, finalUrl, push) {
        var tpl = document.createElement('template');
        tpl.innerHTML = html;
        var fresh = tpl.content.querySelector('#mlRoot');
        if (!fresh) { window.location.href = finalUrl; return; }
        root.replaceWith(fresh);
        root = fresh;
        if (push) { try { history.pushState({ mail: 1 }, '', finalUrl); } catch (e) {} }
        /* The list and the reading pane are new: start them at the top, but do
           not touch the window scroll, so the operator keeps their place. */
        var rows = root.querySelector('.ml-rows');
        if (rows) { rows.scrollTop = 0; }
    }

    function load(url, options) {
        options = options || {};
        if (busy) { return Promise.resolve(); }
        setBusy(true);
        var opts = {
            credentials: 'same-origin',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        };
        if (options.method) { opts.method = options.method; }
        if (options.body) { opts.body = options.body; }
        return fetch(url, opts).then(function (resp) {
            /* A login redirect, a permission page or a server error is not a
               fragment: let the browser show it rather than pasting it in. */
            if (resp.headers.get('X-Mail-Partial') !== '1') {
                window.location.href = resp.url || url;
                return null;
            }
            return resp.text().then(function (html) {
                swap(html, resp.url || url, options.push !== false);
            });
        }).catch(function () {
            if (window.showToast) { showToast('Could not load that part of the mailbox.', 'error'); }
        }).then(function () { setBusy(false); });
    }

    document.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
        var link = e.target.closest ? e.target.closest('a[href]') : null;
        if (!link || !root.contains(link)) { return; }
        var href = link.getAttribute('href') || '';
        if (!href || href.charAt(0) === '#' || link.target) { return; }
        if (!isMailbox(href)) { return; }
        e.preventDefault();
        load(link.href);
    });

    document.addEventListener('submit', function (e) {
        var form = e.target;
        if (!form || !root || !root.contains(form)) { return; }
        if (form.getAttribute('data-ml-plain') === '1') { return; }
        e.preventDefault();
        var action = form.getAttribute('action') || window.location.href;
        var method = (form.getAttribute('method') || 'get').toUpperCase();
        var btn = form.querySelector('button[type=submit]');
        if (btn) { btn.disabled = true; }
        var finish = function () { if (btn) { btn.disabled = false; } };
        if (method === 'GET') {
            var u = new URL(action, window.location.href);
            u.search = new URLSearchParams(new FormData(form)).toString();
            load(u.toString()).then(finish, finish);
            return;
        }
        load(action, { method: 'POST', body: new FormData(form) }).then(finish, finish);
    });

    /* Canned replies and the device picker are inside the fragment, so their
       handlers sit on the document and survive every swap. */
    document.addEventListener('click', function (e) {
        var canned = e.target.closest ? e.target.closest('[data-canned]') : null;
        if (canned) {
            var box = document.getElementById('mlReply');
            if (!box) { return; }
            box.value = (box.value ? box.value + '\n\n' : '') + canned.getAttribute('data-canned');
            box.focus();
            return;
        }
        if (e.target.closest && e.target.closest('#mlDevAll')) {
            var boxes = Array.prototype.slice.call(document.querySelectorAll('.ml-dev-check'));
            var every = boxes.every(function (b) { return b.checked || b.disabled; });
            boxes.forEach(function (b) { if (!b.disabled) { b.checked = !every; } });
            return;
        }
        if (e.target.closest && e.target.closest('#mlDevSend')) {
            var picked = Array.prototype.slice.call(document.querySelectorAll('.ml-dev-check'))
                .filter(function (b) { return b.checked; })
                .map(function (b) { return b.getAttribute('data-email'); });
            if (!picked.length) { alert('Tick at least one device first.'); return; }
            load(MAIL_URL + '?folder=compose&audience=selected&to='
                + encodeURIComponent(picked.join(',')));
        }
    });

    window.addEventListener('popstate', function () {
        if (isMailbox(window.location.href)) { load(window.location.href, { push: false }); }
    });
})();
</script>
{% endblock %}
