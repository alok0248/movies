{% if ip %}<button type="button" class="ipgeo{% if country %} is-known has-flag{% endif %}" data-ip="{{ ip }}" onclick="event.stopPropagation();ipGeo(this)" title="{% if country %}{{ country }}{% if region %} · {{ region }}{% endif %} — click for the full ipwho.is record{% else %}Look up {{ ip }} on ipwho.is{% endif %}"{% if country %} aria-label="{{ country }} — open the ipwho.is record for {{ ip }}"{% endif %}>{% if country %}<span class="ipgeo-flagwrap">{% if flag_img %}<img class="ipgeo-flag-img" src="{{ flag_img }}" alt="" loading="lazy" referrerpolicy="no-referrer">{% elif flag %}<span class="ipgeo-flag">{{ flag }}</span>{% else %}<span class="ipgeo-flag-code">{{ country|slice:":2"|upper }}</span>{% endif %}</span><span class="ipgeo-text"><span class="ipgeo-country">{{ country }}</span>{% if region %}<span class="ipgeo-region">{{ region }}</span>{% endif %}</span>{% else %}Lookup{% endif %}</button>{% endif %}
