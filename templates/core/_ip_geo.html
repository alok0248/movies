{% if ip %}<button type="button" class="ipgeo{% if country %} is-known has-flag{% endif %}" data-ip="{{ ip }}" onclick="event.stopPropagation();ipGeo(this)" title="{% if country %}{{ country }}{% if region %} - {{ region }}{% endif %} — click for the full ipwho.is record{% else %}Look up {{ ip }} on ipwho.is{% endif %}"{% if country %} aria-label="{{ country }} — open the ipwho.is record for {{ ip }}"{% endif %}>{% if country %}<span class="ipgeo-text"><span class="ipgeo-country">{{ country }}</span>{% if region %}<span class="ipgeo-sep">&ndash;</span><span class="ipgeo-region">{{ region }}</span>{% endif %}</span>{% else %}Lookup{% endif %}</button>{% endif %}
