{% if ip %}<button type="button" class="ipgeo{% if country %} is-known has-flag{% endif %}" data-ip="{{ ip }}" onclick="event.stopPropagation();ipGeo(this)" title="{% if country %}{{ country }} — click for the full ipwho.is record{% else %}Look up {{ ip }} on ipwho.is{% endif %}"{% if country %} aria-label="{{ country }} — open the ipwho.is record for {{ ip }}"{% endif %}>{% if country %}{% if flag_img %}<img class="ipgeo-flag-img" src="{{ flag_img }}" alt="" loading="lazy" referrerpolicy="no-referrer">{% elif flag %}<span class="ipgeo-flag">{{ flag }}</span>{% else %}<span class="ipgeo-flag-code">{{ country|slice:":2"|upper }}</span>{% endif %}{% else %}Lookup{% endif %}</button>{% endif %}
