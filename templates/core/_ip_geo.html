{% if ip %}{% if country %}<button type="button" class="ipgeo is-known has-flag" data-ip="{{ ip }}" onclick="event.stopPropagation();ipGeo(this)" title="{{ country }}{% if place %} - {{ place }}{% endif %} — click for the full ipwho.is record" aria-label="{{ country }}{% if place %} - {{ place }}{% endif %} — open the ipwho.is record for {{ ip }}"><span class="ipgeo-text"><span class="ipgeo-country">{{ country }}</span>{% if place %}<span class="ipgeo-sep">&ndash;</span><span class="ipgeo-region">{{ place }}</span>{% endif %}</span></button>{% else %}<a class="ipgeo is-external" href="{{ url }}" target="_blank" rel="noopener noreferrer" data-ip="{{ ip }}" title="{{ ip }} has no saved location yet — open it on iplocation.io in a new tab">iplocation.io<i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i></a>{% endif %}{% endif %}
