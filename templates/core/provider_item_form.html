{% extends 'base.html' %}
{% block content %}<div class="container mt-5 mb-5" style="max-width: 720px;"><div class="card bg-dark border-secondary"><div class="card-body"><h1 class="text-white h4 mb-4">{% if provider %}Edit{% else %}Add{% endif %} Provider</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3{% if field.field.widget.input_type == 'checkbox' %} form-check{% endif %}">{{ field }}<label class="form-label text-light" for="{{ field.id_for_label }}">{{ field.label }}</label>{% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary" type="submit">Save</button> <a href="{% url 'provider_item_list' %}" class="btn btn-outline-light">Cancel</a></form></div></div></div>{% endblock %}
