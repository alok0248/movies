<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direct Player</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--brand:#e50914;--bg:#0b0b0f;--panel:#141420;--line:#26263a;--txt:#e8e8f0;--dim:#9a9ab0}
  html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  .topbar h1{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .topbar h1 small{color:var(--dim);font-weight:400;margin-left:6px}
  .badge{font-size:.62rem;padding:2px 7px;border-radius:10px;background:#1f1f2e;color:var(--dim);white-space:nowrap}
  .badge.ok{background:#12321c;color:#7ddb8f}
  .badge.err{background:#3a1420;color:#ff8ba0}

  /* Layout */
  .main{flex:1;display:flex;min-height:0;flex-direction:row}
  .stage{flex:1;position:relative;background:#000;min-width:0}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}

  /* Sidebar */
  .side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto;transition:margin-right .25s}
  body.collapsed .side{margin-right:-300px}
  .side-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .side-head b{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .side-body{flex:1;overflow-y:auto;padding:8px}
  .src{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
  .src:hover{border-color:#4a4a68;background:#1a1a28}
  .src.active{border-color:var(--brand);background:#241017}
  .src.playing-failed{opacity:.45}
  .src .tag{font-size:.62rem;padding:2px 6px;border-radius:5px;background:#22223a;color:#b9b9d4;white-space:nowrap}
  .src .tag.lang{background:#152a3d;color:#7fc4ee}
  .src .tag.q{background:#1e2f1e;color:#9fd89f}
  .src .nm{font-size:.72rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src .st{font-size:.6rem;color:var(--dim)}

  /* Empty / loading state */
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);text-align:center;padding:20px}
  .empty .big{font-size:2rem}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty button{margin-top:4px;background:var(--brand);border:0;color:#fff;padding:8px 18px;border-radius:6px;font-size:.8rem;cursor:pointer}
  .empty button:hover{filter:brightness(1.15)}

  /* Floating controls */
  .fab{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:6}
  .fab button{background:rgba(20,20,32,.85);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .fab button:hover{border-color:#5a5a80}

  /* Toast */
  #toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);color:#fff;font-size:.72rem;padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:80%;text-align:center}
  #toast.show{opacity:1}

  /* Mobile */
  @media (max-width:760px){
    .main{flex-direction:column}
    .side{width:100%;max-height:38%;border-left:0;border-top:1px solid var(--line)}
    body.collapsed .side{margin-right:0;margin-bottom:-38%}
  }
</style>
</head>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw-proxy.js").catch(function(){});
  }
</script>
<body>
  <div class="topbar">
    <button id="btnSide" class="fab-btn" style="background:none;border:0;color:var(--txt);cursor:pointer;font-size:1rem" title="Toggle sources">☰</button>
    <h1><span id="titleTxt">Loading…</span><small id="yearTxt"></small></h1>
    <span class="badge" id="statusBadge">idle</span>
    <span class="badge" id="countBadge"></span>
  </div>

  <div class="main">
    <div class="stage">
      <video id="vid" controls playsinline></video>
      <div class="empty" id="emptyState">
        <div class="spinner" id="spinner"></div>
        <div id="emptyMsg">Extracting stream links…</div>
        <button id="btnRetry" style="display:none">Retry</button>
      </div>
      <div class="fab">
        <button id="btnFs" title="Fullscreen (F)">⛶</button>
      </div>
      <div id="toast"></div>
    </div>

    <div class="side">
      <div class="side-head"><b>Extracted Links</b><span class="badge" id="langBadge"></span></div>
      <div class="side-body" id="srcList"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var tmdbId  = qs.get('tmdb_id') || '';
  var mType   = (qs.get('type') || 'movie').toLowerCase();
  var season  = qs.get('season') || '';
  var episode = qs.get('episode') || '';
  var langParam = (qs.get('lang') || '').toLowerCase();

  var vid = document.getElementById('vid');
  var hls = null;
  var links = [];
  var activeIdx = -1;
  var triedUrls = {};   // url -> true, prevents retry loops

  var elStatus = document.getElementById('statusBadge');
  var elCount  = document.getElementById('countBadge');
  var elList   = document.getElementById('srcList');
  var elEmpty  = document.getElementById('emptyState');
  var elMsg    = document.getElementById('emptyMsg');
  var elSpin   = document.getElementById('spinner');
  var elRetry  = document.getElementById('btnRetry');
  var elToast  = document.getElementById('toast');
  var elTitle  = document.getElementById('titleTxt');
  var elYear   = document.getElementById('yearTxt');

  function toast(msg, ms){
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ elToast.classList.remove('show'); }, ms || 2600);
  }
  function status(txt, cls){ elStatus.textContent = txt; elStatus.className = 'badge' + (cls ? ' ' + cls : ''); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---------- extraction ---------- */
  function buildApiUrl(){
    var p = new URLSearchParams();
    p.set('tmdb_id', tmdbId);
    p.set('type', mType);
    if (season)  p.set('season', season);
    if (episode) p.set('episode', episode);
    if (langParam) p.set('lang', langParam);
    return '/api/links/?' + p.toString();
  }

  function extract(){
    status('extracting…');
    elSpin.style.display = '';
    elRetry.style.display = 'none';
    elMsg.textContent = 'Extracting stream links…';
    fetch(buildApiUrl(), { headers: { 'Accept': 'application/json' } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.success || !d.links || !d.links.length) {
          return fail(d.error || 'No links found for this title.');
        }
        links = d.links;
        elTitle.textContent = d.title || ('TMDB ' + tmdbId);
        elYear.textContent  = d.year ? ('(' + d.year + ')') : '';
        elCount.textContent = links.length + ' links';
        renderList();
        elEmpty.style.display = 'none';
        status('ready', 'ok');
        play(0); // best-effort first (most reliable) link
      })
      .catch(function(e){ fail('Extraction failed: ' + e.message); });
  }

  function fail(msg){
    status('error', 'err');
    elSpin.style.display = 'none';
    elRetry.style.display = '';
    elMsg.textContent = msg;
    elEmpty.style.display = '';
  }

  /* ---------- source list ---------- */
  function renderList(){
    elList.innerHTML = '';
    links.forEach(function(l, i){
      var div = document.createElement('div');
      div.className = 'src' + (i === activeIdx ? ' active' : '') + (l._failed ? ' playing-failed' : '');
      div.innerHTML =
        '<span class="tag">' + esc(l.server) + '</span>' +
        '<span class="nm">' + esc((l.quality || '?') + ' · ' + (l.type || '').toUpperCase()) + '</span>' +
        (l.language && l.language !== 'Original' ? '<span class="tag lang">' + esc(l.language) + '</span>' : '') +
        '<span class="st">' + (l._failed ? '✕' : (i === activeIdx ? '▶' : '')) + '</span>';
      div.onclick = function(){ play(i); };
      elList.appendChild(div);
    });
  }

  /* ---------- playback with raw→proxy fallback ---------- */
  function isHls(l){ return (l.type === 'hls') || /\.m3u8(\?|$)/.test(l.url || ''); }

  function play(i){
    if (i < 0 || i >= links.length) return;
    var l = links[i];
    activeIdx = i;
    renderList();
    status('connecting…');

    // Candidate URLs for this link: raw CDN first, then server proxy.
    var candidates = [];
    if (l.url && !triedUrls[l.url]) candidates.push(l.url);
    if (l.proxy_url && !triedUrls[l.proxy_url]) candidates.push(l.proxy_url);
    if (!candidates.length) { nextLink(i, 'all routes failed'); return; }

    tryCandidate(i, candidates, 0);
  }

  function tryCandidate(i, candidates, ci){
    var l = links[i];
    var url = candidates[ci];
    var isH = isHls(l);

    destroyHls();
    vid.removeAttribute('src');

    function onFail(){
      triedUrls[url] = true;
      if (ci + 1 < candidates.length) {
        tryCandidate(i, candidates, ci + 1);
      } else {
        l._failed = true;
        renderList();
        nextLink(i, 'failed');
      }
    }

    if (isH && window.Hls && Hls.isSupported()) {
      hls = new Hls({
        manifestLoadingTimeOut: 10000,
        manifestLoadingMaxRetry: 1,
        levelLoadingTimeOut: 10000,
        fragLoadingTimeOut: 20000,
      });
      hls.on(Hls.Events.ERROR, function(_, data){
        if (!data.fatal) return;
        destroyHls();
        onFail();
      });
      hls.on(Hls.Events.MANIFEST_PARSED, function(){
        elEmpty.style.display = 'none';
        status('playing', 'ok');
        vid.play().catch(function(){ /* autoplay blocked — user taps play */ });
      });
      hls.loadSource(url);
      hls.attachMedia(vid);
    } else {
      // mp4 (or native HLS on Safari)
      vid.src = url;
      vid.onerror = onFail;
      vid.play().then(function(){
        elEmpty.style.display = 'none';
        status('playing', 'ok');
      }).catch(function(){ /* autoplay blocked; wait for real error or user play */ });
    }
  }

  function nextLink(i, why){
    if (i + 1 < links.length) {
      toast('Link ' + (i + 1) + ' failed (' + why + ') — trying next…');
      play(i + 1);
    } else {
      status('no playable link', 'err');
      elSpin.style.display = 'none';
      elRetry.style.display = '';
      elMsg.textContent = 'No playable link found. The extracted URLs may have expired — retry to re-extract.';
      elEmpty.style.display = '';
    }
  }

  function destroyHls(){
    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
    vid.onerror = null;
  }

  /* ---------- controls ---------- */
  document.getElementById('btnFs').onclick = function(){
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (vid.requestFullscreen) { vid.requestFullscreen(); }
    else if (vid.webkitRequestFullscreen) { vid.webkitRequestFullscreen(); }
  };
  document.addEventListener('keydown', function(e){
    if (e.key === 'f' || e.key === 'F') document.getElementById('btnFs').onclick();
  });
  document.getElementById('btnSide').onclick = function(){ document.body.classList.toggle('collapsed'); };
  elRetry.onclick = function(){
    triedUrls = {}; links = []; activeIdx = -1; destroyHls(); extract();
  };

  /* ---------- boot ---------- */
  if (!tmdbId) {
    fail('Missing ?tmdb_id= — e.g. direct-player/?tmdb_id=550&type=movie');
  } else {
    extract();
  }
})();
</script>
</body>
</html>
