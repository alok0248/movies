{% extends 'base.html' %}
{% block content %}<div class="container mt-5 mb-5" style="max-width: 650px;"><div class="card bg-dark border-secondary"><div class="card-body"><h1 class="text-white h4 mb-4">{% if region %}Edit{% else %}Add{% endif %} Watch Region</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3{% if field.field.widget.input_type == 'checkbox' %} form-check{% endif %}">{{ field }}<label class="form-label text-light" for="{{ field.id_for_label }}">{{ field.label }}</label>{% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Save</button> <a href="{% url 'watch_region_list' %}" class="btn btn-outline-light">Cancel</a></form></div></div></div>{% endblock %}
