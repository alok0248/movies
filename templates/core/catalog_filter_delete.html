{% extends 'base.html' %}
{% block content %}<div class="container mt-5" style="max-width: 650px;"><div class="card bg-dark border-danger"><div class="card-body"><h1 class="h4 text-white">Delete {{ object_type|title }}</h1><p class="text-light">Delete "{{ object }}"? Provider-region availability linked to it will also be removed.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Delete</button> <a href="{% url cancel_url_name %}" class="btn btn-outline-light">Cancel</a></form></div></div></div>{% endblock %}
